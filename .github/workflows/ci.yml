name: CI SassBlum

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        # requirements.lock fija versiones + hashes SHA-256 (directos + transitivos)
        # para linux/amd64 + Python 3.12.
        # --require-hashes: verificación explícita de integridad (Sonar S6471).
        # --only-binary: solo wheels, nunca setup.py arbitrarios.
        run: |
          pip install --only-binary=:all: --require-hashes -r requirements.lock

      - name: Create CI env file
        run: |
          cat > .env << 'EOF'
          DJANGO_SECRET_KEY=ci-only-secret-key-not-used-in-production
          DJANGO_DEBUG=True
          DATABASE_URL=postgresql://ci:ci@localhost:5432/ci
          JWT_ACCESS_TOKEN_LIFETIME=3600
          JWT_REFRESH_TOKEN_LIFETIME=604800
          EOF

      - name: Django System Check
        run: python manage.py check

      - name: Run Flake8
        run: flake8 apps config core --max-line-length=120 --exclude=migrations

      - name: Run Backend Test Suite
        run: pytest -v

      - name: Run API Acceptance Suite
        run: pytest ../tests/acceptance -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 trae npm 11: npm 10 (Node 22) tiene un bug con las
          # bundledDependencies de paquetes wasm opcionales
          # (@tailwindcss/oxide-wasm32-wasi) que rompe `npm ci` con EUSAGE.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        # --ignore-scripts: ningún paquete ejecuta lifecycle scripts al instalar.
        # Los binarios nativos (esbuild, oxide) llegan como optionalDependencies,
        # no via postinstall, así que el build no los necesita.
        run: npm ci --ignore-scripts

      - name: TypeScript Check
        # --no-install: usa el tsc del node_modules ya instalado; npx nunca
        # descarga ni ejecuta un paquete on-demand.
        run: npx --no-install tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Production Bundle
        run: npm run build
