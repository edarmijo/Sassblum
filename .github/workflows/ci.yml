name: CI SassBlum

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        # requirements.lock fija versiones + hashes SHA-256 (directos + transitivos)
        # para linux/amd64 + Python 3.12. Los hashes activan verificación implícita.
        # --only-binary: solo wheels, nunca setup.py arbitrarios.
        run: |
          python -m pip install "pip==25.3"
          pip install --only-binary=:all: -r requirements.lock

      - name: Create CI env file
        run: |
          cat > .env << 'EOF'
          DJANGO_SECRET_KEY=ci-only-secret-key-not-used-in-production
          DJANGO_DEBUG=True
          DATABASE_URL=postgresql://ci:ci@localhost:5432/ci
          JWT_ACCESS_TOKEN_LIFETIME=3600
          JWT_REFRESH_TOKEN_LIFETIME=604800
          EOF

      - name: Django System Check
        run: python manage.py check

      - name: Run Unit Tests
        run: pytest -v -m "not django_db"

      - name: Run Flake8 (non-blocking)
        run: flake8 apps config core --max-line-length=120 --exclude=migrations
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 trae npm 11: npm 10 (Node 22) tiene un bug con las
          # bundledDependencies de paquetes wasm opcionales
          # (@tailwindcss/oxide-wasm32-wasi) que rompe `npm ci` con EUSAGE.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        # --ignore-scripts: ningún paquete ejecuta lifecycle scripts al instalar.
        # Los binarios nativos (esbuild, oxide) llegan como optionalDependencies,
        # no via postinstall, así que el build no los necesita.
        run: npm ci --ignore-scripts

      - name: TypeScript Check
        # --no-install: usa el tsc del node_modules ya instalado; npx nunca
        # descarga ni ejecuta un paquete on-demand.
        run: npx --no-install tsc --noEmit

      - name: Run Unit Tests
        run: npm run test
