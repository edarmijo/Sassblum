# Configuración del ANÁLISIS AUTOMÁTICO de SonarQube Cloud.
# (El análisis automático NO lee sonar-project.properties — solo este archivo.)

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=backend/**/tests/**,frontend/**/tests/**,frontend/src/test/**,frontend/src/**/*.test.*,frontend/src/**/*.spec.*,tests/**,deploy/cpanel-relay/tests/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Las plantillas de email usan tablas de layout y role="presentation" a propósito:
# es la única técnica fiable en clientes de correo (Outlook renderiza con el motor
# de Word y no soporta CSS de layout moderno). Las reglas de accesibilidad web
# no aplican al HTML de email, por eso se excluyen del análisis.
sonar.exclusions=backend/apps/notifications/templates/email/**,frontend/src/generated/**
sonar.cpd.exclusions=frontend/src/generated/**
