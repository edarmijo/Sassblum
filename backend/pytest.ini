[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Tests con @pytest.mark.django_db requieren conexión a la BD (Supabase / PG local).
# Los tests de estrategias y NotificationService usan mocks y corren sin BD.
# --reuse-db: NO dropear/recrear la BD de test entre corridas (evita el error
# "database test_postgres is being accessed by other users" del pooler de Supabase).
# La PRIMERA vez, o tras nuevas migraciones, corre:  pytest --create-db
addopts = -ra --reuse-db
asyncio_default_fixture_loop_scope = function
