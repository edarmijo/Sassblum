services:
  redis:
    image: redis:7-alpine
    container_name: sassblum_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable tag or digest}
    container_name: sassblum_backend_prod
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "True"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      AUTH_COOKIE_SAMESITE: "Lax"
      AUTH_COOKIE_SECURE: "True"
      JWT_ACCESS_TOKEN_LIFETIME: 3600
      JWT_REFRESH_TOKEN_LIFETIME: 604800
      EMAIL_BACKEND: ${EMAIL_BACKEND:?Set EMAIL_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      EMAIL_CC: ${EMAIL_CC:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL}
      SASSBLUM_CONTACT_PHONE: ${SASSBLUM_CONTACT_PHONE:-}
      SASSBLUM_CONTACT_EMAIL: ${SASSBLUM_CONTACT_EMAIL:-}
      SASSBLUM_CONTACT_HOURS: ${SASSBLUM_CONTACT_HOURS:-}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-sassblum}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable tag or digest}
    container_name: sassblum_frontend_prod
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data_prod:
