sonar.projectKey=edarmijo_SassBlumRedise-oWeb
sonar.organization=edarmijo

# Las plantillas de email usan tablas de layout y role="presentation" a propósito:
# es la única técnica fiable en clientes de correo (Outlook renderiza con el motor
# de Word y no soporta CSS de layout moderno). Las reglas de accesibilidad web
# (tablas de layout, roles) no aplican al HTML de email, por eso se excluyen.
sonar.exclusions=backend/apps/notifications/templates/email/**


