[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# El backend debe estar en sys.path para importar apps.* y config.settings;
# "." permite importar helpers.py desde los módulos de test.
pythonpath = ../../backend .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --reuse-db: evita CREATE/DROP DATABASE contra el pooler de Supabase
# (misma razón que backend/pytest.ini). Primera vez: pytest --create-db
addopts = -ra --reuse-db
